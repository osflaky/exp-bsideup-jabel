name: CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    - name: Set up JDK
      uses: actions/setup-java@v1
      with:
        java-version: 16
    - name: Build with Gradle
      run: ./gradlew build
    name: build [ubuntu-latest--x64]
    timeout-minutes: 150
